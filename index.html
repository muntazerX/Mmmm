      meditateQi() {
        soundEngine.playClick();
        const p = this.gameState.player;
        p.daily_meditate = p.daily_meditate || 0;

        if (p.daily_meditate >= 2) {
          soundEngine.playFail();
          alert("لقد تأملت مرتين اليوم! بلغت قدرة استيعاب مسارات التشي حدها الأقصى لليوم. نم بنزل أو خيم لليوم التالي.");
          return;
        }

        const totalCal = (p.calories_current || 0) + (p.backpack_calories || 0);
        if (totalCal < 350) {
          soundEngine.playFail();
          alert("لا تملك سعرات حرارية كافية لممارسة التأمل وصقل التشي (يلزم 350 سعرة حرارية)!");
          return;
        }

        let remCal = 350;
        if ((p.backpack_calories || 0) >= remCal) {
          p.backpack_calories -= remCal;
          remCal = 0;
        } else {
          remCal -= (p.backpack_calories || 0);
          p.backpack_calories = 0;
          p.calories_current = Math.max(0, (p.calories_current || 0) - remCal);
        }

        p.daily_meditate += 1;
        p.xp += 15;
        this.checkAndAutoLevelUp();
        p.ap_current = Math.min(p.ap_max, (p.ap_current || 0) + 25);
        this.syncProvisionsInventory();

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🧘 أغلقت عينيك واستجمعت طاقة التشي في قنوات جسدك. استهلكت 350 سعرة حرارية بدقة، واكتسبت +15 نقطة خبرة صقل واستعدت +25 AP (جلسة ${p.daily_meditate}/2 لليوم).`
        });
        this.recordSummary(`مارس اللاعب تأمل وصقل طاقة التشي في [${p.current_landmark}].`, 'cultivate');
        this.saveState();
        this.render();
      }

      arenaDuel() {
        soundEngine.playClick();
        const p = this.gameState.player;
        p.daily_duels = p.daily_duels || 0;

        if (p.daily_duels >= 2) {
          soundEngine.playFail();
          alert("لقد خضت نزالين اليوم! بلغت عضلاتك وطاقتك حد الإجهاد الأقصى لليوم. نم في نزل أو خيم لليوم التالي.");
          return;
        }

        if ((p.ap_current || 0) < 30) {
          soundEngine.playFail();
          alert(`طاقتك منهكة (${p.ap_current}/30 AP)! تحتاج إلى الراحة أو النوم لاستعادة نشاطك.`);
          return;
        }

        if ((p.hp_current || 0) < 30) {
          soundEngine.playFail();
          alert(`صحتك منخفضة جداً (${p.hp_current} HP)! النزال بهذا الوضع يعرض حياتك للهلاك الحقيقي.`);
          return;
        }

        const totalCal = (p.calories_current || 0) + (p.backpack_calories || 0);
        if (totalCal < 400) {
          soundEngine.playFail();
          alert("لا تملك طاقة وسعرات كافية للقتال (يلزم 400 سعرة حرارية)!");
          return;
        }

        if (this.getPlayerCopper() < 25) {
          soundEngine.playFail();
          alert("لا تملك رسوم نزال الحلبة (25 نحاسية)!");
          return;
        }

        // Strict deduction of 25 copper
        this.deductCopper(25);
        p.ap_current = Math.max(0, (p.ap_current || 0) - 30);
        p.daily_duels += 1;

        let remCal = 400;
        if ((p.backpack_calories || 0) >= remCal) {
          p.backpack_calories -= remCal;
          remCal = 0;
        } else {
          remCal -= (p.backpack_calories || 0);
          p.backpack_calories = 0;
          p.calories_current = Math.max(0, (p.calories_current || 0) - remCal);
        }
        this.syncProvisionsInventory();

        const win = Math.random() > 0.40;
        if (win) {
          soundEngine.playSuccess();
          p.xp += 25;
          this.checkAndAutoLevelUp();
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `⚔️ خضت نزالاً قتالياً في ساحة [${p.current_landmark}]. بضربة متقنة تمكنت من التغلب على خصمك وفزت بالنزال ونلت خبرة قتالية (+25 XP). خصمت رسوم الحلبة (25 نحاسية) بدقة صارمة.`
          });
        } else {
          soundEngine.playFail();
          p.hp_current = Math.max(1, (p.hp_current || 0) - 25);
          p.xp += 8;
          this.checkAndAutoLevelUp();
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `⚔️ خضت نزالاً شرساً في الحلبة وتلقيت ضربة مؤلمة (-25 HP)، لكنك استفدت خبرة وصلابة (+8 XP). خصمت رسوم الحلبة (25 نحاسية) بدقة صارمة.`
          });
        }
        this.recordSummary(`خاض اللاعب نزالاً وتحدياً قتالياً في ساحة [${p.current_landmark}].`, 'combat');
        this.saveState();
        this.render();
      }

      confirmTravel(destName, dist, days, calNeeded, waterNeeded, moneyCost = 0, modeName = 'مشي على الأقدام', modeId = 'foot') {
        const p = this.gameState.player;
        const w = this.gameState.world_state;
        const currentLm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];
        const mode = TRANSPORT_MODES.find(m => m.id === modeId) || TRANSPORT_MODES[0];
        const chk = checkTransportAvailability(p, mode, dist, currentLm);

        if (chk.locked) {
          soundEngine.playFail();
          alert(chk.reason);
          return;
        }

        const totalAvailCal = (p.calories_current || 0) + (p.backpack_calories || 0);
        const totalAvailWater = (p.water_current || 0) + (p.backpack_water || 0);
        const playerCopper = this.getPlayerCopper();

        if (playerCopper < moneyCost) {
          soundEngine.playFail();
          alert(`⛔ عجز مالي! أجرة السفر بـ [${modeName}] تبلغ ${moneyCost.toLocaleString('ar-SA')} نحاسية، وأنت تملك فقط ${playerCopper.toLocaleString('ar-SA')} نحاسية.`);
          return;
        }

        if (totalAvailCal < calNeeded || totalAvailWater < waterNeeded) {
          soundEngine.playFail();
          alert(`⛔ عجز قاطع في المؤن! لا يمكنك الانطلاق في هذه الرحلة الشاقة.\nمطلوب: ${calNeeded.toLocaleString('ar-SA')} سعرة و ${waterNeeded} وحدة ماء.\nالمتوفر لديك: ${totalAvailCal.toLocaleString('ar-SA')} سعرة و ${totalAvailWater} وحدة ماء.`);
          return;
        }

        soundEngine.playSuccess();
        const oldDay = w.day;
        const prevLandmark = p.current_landmark;

        if (moneyCost > 0) {
          this.deductCopper(moneyCost);
        }

        let remCal = calNeeded;
        if ((p.backpack_calories || 0) >= remCal) {
          p.backpack_calories -= remCal;
          remCal = 0;
        } else {
          remCal -= (p.backpack_calories || 0);
          p.backpack_calories = 0;
          p.calories_current = Math.max(0, (p.calories_current || 0) - remCal);
        }

        let remWater = waterNeeded;
        if ((p.backpack_water || 0) >= remWater) {
          p.backpack_water -= remWater;
          remWater = 0;
        } else {
          remWater -= (p.backpack_water || 0);
          p.backpack_water = 0;
          p.water_current = Math.max(0, (p.water_current || 0) - remWater);
        }

        this.syncProvisionsInventory();

        w.day += days;
        w.turn += 1;
        p.current_landmark = destName;
        p.daily_duels = 0;
        p.daily_meditate = 0;

        this.gameState.story_log.push({
          turn: w.turn,
          day: w.day,
          text: `🚶 انطلقت من [${prevLandmark}] قاصداً [${destName}] بواسطة [${modeName}] على مسافة ${dist} كم مستغرقاً ${days} أيام بسلام.
الحسابات الاقتصادية والزاد المستهلك بدقة:
${moneyCost > 0 ? `💰 تكلفة وأجرة النقل المدفوعة: ${moneyCost.toLocaleString('ar-SA')} نحاسية.\n` : ''}🔥 السعرات المستهلكة: ${calNeeded.toLocaleString('ar-SA')} سعرة (المتبقي بالحقيبة: ${(p.backpack_calories || 0).toLocaleString('ar-SA')} سعرة، وفي الجسد: ${(p.calories_current || 0).toLocaleString('ar-SA')} سعرة).
💧 المياه المستهلكة: ${waterNeeded} وحدة ماء (المتبقي بالحقيبة: ${p.backpack_water || 0} وحدة، وفي الجسد: ${p.water_current || 0} وحدة).
وصلت إلى [${destName}] مع فجر اليوم ${w.day} (بعد أن كان اليوم ${oldDay}).`
        });

        this.recordSummary(`سافر اللاعب من [${prevLandmark}] إلى [${destName}] بسلام.`, 'travel');

        this.selectedTravelTarget = null;
        this.saveState();
        this.switchView('chat');
      }

      checkAndAutoLevelUp() {
        const p = this.gameState.player;
        let rank = getRankData(p.level);
        while (p.xp >= rank.xpNeeded && p.level < 150) {
          p.xp -= rank.xpNeeded;
          p.level += 1;
          p.hp_max += 15;
          p.hp_current = p.hp_max;
          p.ap_max += 10;
          p.ap_current = p.ap_max;
          p.base_damage += 2;
          p.defense += 1;
          p.rank = getRankData(p.level).rank.name;
          soundEngine.playBreakthrough();
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `🌟 بفضل تراكم الخبرة والتدريب، ارتقيت تلقائياً إلى **المستوى ${p.level}** (${p.rank})!`
          });
          rank = getRankData(p.level);
        }
      }

      attemptBreakthrough() {
        const p = this.gameState.player;
        const rank = getRankData(p.level);
        if (p.xp < rank.xpNeeded) return;

        soundEngine.playBreakthrough();
        p.level += 1;
        p.xp = p.xp - rank.xpNeeded;
        p.hp_max += 15;
        p.hp_current = p.hp_max;
        p.ap_max += 10;
        p.ap_current = p.ap_max;
        p.base_damage += 2;
        p.defense += 1;
        p.rank = getRankData(p.level).rank.name;
        p.level_challenge = null;

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🌟 أنجزت اختبار الصقل وارتقيت إلى **المستوى ${p.level}** (${p.rank})!\nتدفقت طاقة هائلة في عروقك، وازدادت صحتك القصوى (+15) وقوة ضربتك (+2).`
        });

        this.saveState();
        this.render();
      }

      getEntranceExam(factionId) {
        const w = this.gameState.world_state;
        w.entrance_exams = w.entrance_exams || {};
        if (!w.entrance_exams[factionId]) {
          w.entrance_exams[factionId] = generateEntranceExam(factionId);
        }
        return w.entrance_exams[factionId];
      }

      submitEntranceExam(factionId) {
        const p = this.gameState.player;
        const f = INITIAL_FACTIONS[factionId];
        if (!f) return;
        if (p.current_landmark !== f.landmark) {
          soundEngine.playFail();
          alert(`قاعدة حتمية لا يمكن كسرها! يجب التواجد شخصياً في [${f.landmark}] لتسليم متطلبات اختبار القبول والانضمام لـ [${f.name}]. (موقعك الحالي: ${p.current_landmark}).`);
          return;
        }

        const exam = this.getEntranceExam(factionId);
        if (!exam) return;

        const invItem = (p.inventory || []).find(it => (it.item === exam.requiredItem || it.name === exam.requiredItem));
        const curQty = invItem ? (invItem.qty || 1) : 0;
        if (curQty < exam.requiredQty) {
          soundEngine.playFail();
          alert(`متطلبات اختبار القبول غير مكتملة! مطلوب: [${exam.requiredItem} ×${exam.requiredQty}] (المتوفر لديك: ${curQty}). يمكنك شراؤه من سوق [${f.landmark}] الحضري.`);
          return;
        }

        const curCopper = this.getPlayerCopper();
        if (curCopper < exam.feeCopper) {
          soundEngine.playFail();
          alert(`رسوم التسجيل والتوثيق غير كافية! يلزم سداد ${exam.feeCopper} نحاس (المتوفر لديك: ${curCopper} نحاس).`);
          return;
        }

        soundEngine.playBreakthrough();

        this.deductCopper(exam.feeCopper);
        invItem.qty -= exam.requiredQty;
        if (invItem.qty <= 0) {
          const idx = p.inventory.indexOf(invItem);
          if (idx !== -1) p.inventory.splice(idx, 1);
        }

        p.faction_id = f.id;
        p.faction_rank = exam.rankGranted;
        p.xp += exam.rewardXp;
        p.faction_relations = p.faction_relations || {};
        p.faction_relations[factionId] = (p.faction_relations[factionId] || 0) + exam.rewardAffinity;

        this.syncProvisionsInventory();

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🌟 اجتزت اختبار القبول والانضمام بنجاح فائق أمام شيوخ [${f.name}] في [${f.landmark}]!\nقُبلت رسمياً برتبة [${p.faction_rank}] وحصلت على خاصية: ${f.exclusivePerk}.\n(سُلمت متطلبات الاختبار: [${exam.requiredItem} ×${exam.requiredQty}] ورسم توثيق ${exam.feeCopper} نحاس · +${exam.rewardXp} XP و+${exam.rewardAffinity} علاقة).`
        });

        this.saveState();
        this.render();
      }

      getPromotionExam(factionId, targetRankIndex) {
        const w = this.gameState.world_state;
        const p = this.gameState.player;
        w.promotion_exams = w.promotion_exams || {};
        const key = `${factionId}_${targetRankIndex}`;
        if (!w.promotion_exams[key]) {
          w.promotion_exams[key] = generatePromotionExam(factionId, targetRankIndex, p.level);
        }
        return w.promotion_exams[key];
      }

      submitPromotionExam(factionId) {
        const p = this.gameState.player;
        const f = INITIAL_FACTIONS[factionId];
        if (!f) return;
        if (p.current_landmark !== f.landmark) {
          soundEngine.playFail();
          alert(`قاعدة حتمية! يجب أن تتواجد شخصياً في مقر [${f.name}] بـ [${f.landmark}] لخوض اختبار الترقية وتقديم المعروض أمام مجلس الشيوخ.`);
          return;
        }

        const currentRankIdx = (f.ranks || []).findIndex(r => r.name === p.faction_rank);
        const nextRankIdx = currentRankIdx + 1;
        const nextRank = f.ranks && f.ranks[nextRankIdx];
        if (!nextRank) return;

        if (p.level < nextRank.minLevel) {
          soundEngine.playFail();
          alert(`مستواك الحالي (${p.level}) لا يؤهلك للترقية بعد! يلزم بلوغ المستوى ${nextRank.minLevel}.`);
          return;
        }

        const exam = this.getPromotionExam(factionId, nextRankIdx);
        if (!exam) return;

        const invItem = (p.inventory || []).find(it => (it.item === exam.requiredItem || it.name === exam.requiredItem));
        const curQty = invItem ? (invItem.qty || 1) : 0;
        if (curQty < exam.requiredQty) {
          soundEngine.playFail();
          alert(`متطلبات اختبار الترقية ناقصة! مطلوب: [${exam.requiredItem} ×${exam.requiredQty}] (المتوفر لديك: ${curQty}). يمكنك توفيره من السوق أو إنجاز المهام.`);
          return;
        }

        const curPromotionCopper = this.getPlayerCopper();
        if (curPromotionCopper < exam.feeCopper) {
          soundEngine.playFail();
          alert(`رسوم ديوان الترقية غير كافية! يلزم سداد ${exam.feeCopper} نحاس لمجلس الشيوخ.`);
          return;
        }

        soundEngine.playBreakthrough();

        this.deductCopper(exam.feeCopper);
        invItem.qty -= exam.requiredQty;
        if (invItem.qty <= 0) {
          const idx = p.inventory.indexOf(invItem);
          if (idx !== -1) p.inventory.splice(idx, 1);
        }

        p.faction_rank = nextRank.name;
        p.xp += exam.rewardXp;
        this.syncProvisionsInventory();

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `👑 اجتزت اختبار الترقية ببراعة فائقة ورُقيت رسمياً إلى رتبة [${nextRank.name}] في ${f.name}!\nنلت ختم الترقية المعتمد والمزايا: ${nextRank.perks}.\n(قُدمت متطلبات الاختبار: [${exam.requiredItem} ×${exam.requiredQty}] ورسوم ديوان ${exam.feeCopper} نحاس · +${exam.rewardXp} XP صقل).`
        });

        this.saveState();
        this.render();
      }

      leaveFaction() {
        soundEngine.playClick();
        const p = this.gameState.player;
        p.faction_id = null;
        p.faction_rank = null;
        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `غادرت الطائفة وأصبحت مقاتلاً حراً بدون ولاء سياسي.`
        });
        this.saveState();
        this.render();
      }

      getFactionMissions(factionId) {
        const w = this.gameState.world_state;
        const currentWeek = Math.floor(((w.day || 1) - 1) / 7) + 1;
        w.faction_missions = w.faction_missions || {};
        const currentList = w.faction_missions[factionId] || [];

        if (w.missions_week !== currentWeek || currentList.length === 0) {
          const fresh = generateWeeklyFactionMissions(factionId, currentWeek);
          const activeOnes = currentList.filter(m => m.status === 'active');
          const finalPool = [...activeOnes];
          fresh.forEach(fm => {
            if (!finalPool.some(existing => existing.title === fm.title)) {
              finalPool.push(fm);
            }
          });
          w.faction_missions[factionId] = finalPool;
          w.missions_week = currentWeek;
        }

        return (w.faction_missions[factionId] || []).filter(m => m.status !== 'completed');
      }

      acceptFactionMission(missionId, factionId) {
        const p = this.gameState.player;
        const f = INITIAL_FACTIONS[factionId];
        if (!f) return;
        if (p.current_landmark !== f.landmark) {
          soundEngine.playFail();
          alert(`قاعدة حتمية لا يمكن كسرها! لا يمكنك استلام مهام ${f.name} إلا بالحضور شخصياً إلى مقرها في [${f.landmark}]. موقعك الحالي: [${p.current_landmark}].`);
          return;
        }

        const list = this.getFactionMissions(factionId);
        const m = list.find(it => it.id === missionId);
        if (!m || m.status !== 'available') return;

        soundEngine.playSuccess();
        m.status = 'active';
        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `📜 استلمت مهمة [${m.title}] من ديوان ${f.name} في [${f.landmark}].\nالمطلوب إنجازه: احضر [${m.requiredItem}] ×${m.requiredQty}.\nالمكافأة المقررة: ${m.rewardCopper.toLocaleString('ar-SA')} نحاسية (${m.rewardCopper >= 100 ? `${Math.floor(m.rewardCopper/100)} فضية` : ''}) و+${m.rewardXp} XP و+${m.rewardAffinity} علاقة.`
        });

        this.saveState();
        this.render();
      }

      completeFactionMission(missionId, factionId) {
        const p = this.gameState.player;
        const f = INITIAL_FACTIONS[factionId];
        if (!f) return;
        const list = this.getFactionMissions(factionId);
        const m = list.find(it => it.id === missionId);
        if (!m || m.status !== 'active') return;

        if (p.current_landmark !== f.landmark) {
          soundEngine.playFail();
          alert(`قاعدة حتمية لا يمكن كسرها! يجب أن تتواجد شخصياً في مقر [${f.name}] بـ [${f.landmark}] لتسليم المهمة وفحص العنصر ونيل الجائزة! (موقعك الحالي: ${p.current_landmark}).`);
          return;
        }

        const invItem = (p.inventory || []).find(it => (it.item === m.requiredItem || it.name === m.requiredItem));
        const currentQty = invItem ? (invItem.qty || 1) : 0;
        if (currentQty < m.requiredQty) {
          soundEngine.playFail();
          alert(`العنصر المطلوب غير متوفر بالحقيبة بعد! مطلوب: ${m.requiredItem} ×${m.requiredQty} (المتوفر لديك: ${currentQty}).`);
          return;
        }

        soundEngine.playBreakthrough();

        invItem.qty -= m.requiredQty;
        if (invItem.qty <= 0) {
          const idx = p.inventory.indexOf(invItem);
          if (idx !== -1) p.inventory.splice(idx, 1);
        }

        let totalW = 0;
        (p.inventory || []).forEach(it => { totalW += (it.weight || 0.5) * (it.qty || 1); });
        p.carry_weight_current = Math.round(totalW * 10) / 10;

        this.addCopper(m.rewardCopper);
        p.xp += m.rewardXp;
        this.checkAndAutoLevelUp();
        p.faction_relations = p.faction_relations || {};
        p.faction_relations[factionId] = (p.faction_relations[factionId] || 0) + m.rewardAffinity;

        m.status = 'completed';
        const mIdx = list.findIndex(it => it.id === missionId);
        if (mIdx !== -1) {
          list.splice(mIdx, 1);
        }

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🎖️ قمت بتسليم مهمة [${m.title}] بنجاح إلى شيوخ [${f.name}] في [${f.landmark}]!\nاستلمت الجائزة المعتمدة بميزان التجارة: +${m.rewardCopper.toLocaleString('ar-SA')} نحاسية، و+${m.rewardXp} XP صقل.\nاختفت المهمة المكتملة من اللوحة، وارتفعت علاقتك الرسمية معهم بمقدار (+${m.rewardAffinity} نقطة علاقة) وأصبح إجمالي علاقتك: ${p.faction_relations[factionId] >= 0 ? '+' : ''}${p.faction_relations[factionId]}.`
        });

        this.saveState();
        this.render();
      }

      abandonFactionMission(missionId, factionId) {
        soundEngine.playClick();
        const list = this.getFactionMissions(factionId);
        const m = list.find(it => it.id === missionId);
        if (m && m.status === 'active') {
          m.status = 'available';
          this.saveState();
          this.render();
        }
      }

      buyMarketItem(id, name, priceCopper, weight, calories, water, damage, defense, desc, category, slot = null, hands = 1, isShield = false) {
        const p = this.gameState.player;
        const currentCopper = this.getPlayerCopper();
        if (currentCopper < priceCopper) {
          soundEngine.playFail();
          alert("المال الذي تحمله لا يكفي لشراء هذا العنصر!");
          return;
        }

        const w = this.gameState.world_state;

        if (category === 'food' || (calories > 0 && !damage && !defense && !desc.includes('إكسير') && !desc.includes('ترياق'))) {
          const maxBagCal = p.backpack_calories_max || 25000;
          const curBagCal = p.backpack_calories || 0;
          if (curBagCal + calories > maxBagCal) {
            soundEngine.playFail();
            alert(`مخزن السعرات في الحقيبة ممتلئ! السعة القصوى لحقيبتك: ${maxBagCal.toLocaleString('ar-SA')} سعرة حرارية.`);
            return;
          }

          if (w.market_stock) {
            Object.values(w.market_stock).forEach(catList => {
              const found = catList.find(it => it.id === id);
              if (found && found.stock > 0) found.stock -= 1;
            });
          }

          soundEngine.playSuccess();
          this.deductCopper(priceCopper);
          p.backpack_calories = curBagCal + calories;
          this.syncProvisionsInventory();

          this.gameState.story_log.push({
            turn: w.turn,
            day: w.day,
            text: `🍞 اشتريت زاد طعام (${name}). أُضيفت مباشرة إلى مخزن سعرات الحقيبة.`
          });

          this.saveState();
          this.render();
          return;
        }

        if (category === 'water' || (water > 0 && !damage && !defense)) {
          const maxBagWater = p.backpack_water_max || 20;
          const curBagWater = p.backpack_water || 0;
          if (curBagWater + water > maxBagWater) {
            soundEngine.playFail();
            alert(`مخزن وحدات الماء في الحقيبة ممتلئ! السعة القصوى لقِرَب الحقيبة: ${maxBagWater} وحدة ماء.`);
            return;
          }

          if (w.market_stock) {
            Object.values(w.market_stock).forEach(catList => {
              const found = catList.find(it => it.id === id);
              if (found && found.stock > 0) found.stock -= 1;
            });
          }

          soundEngine.playSuccess();
          this.deductCopper(priceCopper);
          p.backpack_water = curBagWater + water;
          this.syncProvisionsInventory();

          this.gameState.story_log.push({
            turn: w.turn,
            day: w.day,
            text: `💧 اشتريت مياه نقية (${name}). أُضيفت مباشرة إلى مخزن قِرَب الحقيبة.`
          });

          this.saveState();
          this.render();
          return;
        }

        if (w.market_stock) {
          Object.values(w.market_stock).forEach(catList => {
            const found = catList.find(it => it.id === id);
            if (found && found.stock > 0) found.stock -= 1;
          });
        }

        soundEngine.playSuccess();
        this.deductCopper(priceCopper);

        p.inventory = p.inventory || [];
        const existing = p.inventory.find(i => i.id === id || i.item === name);
        if (existing) {
          existing.qty = (existing.qty || 1) + 1;
        } else {
          p.inventory.push({
            id, item: name, qty: 1, weight: weight || 0.5,
            calories: calories || 0, water: water || 0,
            damage: damage || 0, defense: defense || 0,
            slot: slot || null,
            hands: Number(hands) || 1,
            isShield: Boolean(isShield),
            hp: (category === 'potions') ? (desc.includes('120') ? 120 : desc.includes('95') ? 95 : 50) : 0,
            desc
          });
        }

        this.syncProvisionsInventory();

        this.gameState.story_log.push({
          turn: w.turn,
          day: w.day,
          text: `🛒 اشتريت [${name}] مقابل ${priceCopper.toLocaleString('ar-SA')} نحاسية، وأُودع في حقيبة السفر. يمكنك تجهيزه يدوياً في خانات العتاد بحسب اختيارك.`
        });

        this.saveState();
        this.render();
      }

      feedBodyFromBackpack() {
        const p = this.gameState.player;
        const need = (p.calories_max || 10000) - (p.calories_current || 0);
        if (need <= 0) {
          soundEngine.playFail();
          alert("سعرات جسدك ممتلئة بالكامل بالفعل (10,000 / 10,000)! لا حاجة لتناول زاد إضافي الآن.");
          return;
        }
        if ((p.backpack_calories || 0) <= 0) {
          soundEngine.playFail();
          alert("لا تملك سعرات حرارية في حقيبة السفر! اشترِ مؤن من السوق الحضري.");
          return;
        }

        const take = Math.min(need, p.backpack_calories);
        p.backpack_calories -= take;
        p.calories_current += take;
        this.syncProvisionsInventory();
        soundEngine.playSuccess();

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🍞 تناولت زاداً من حقيبة السفر (${take.toLocaleString('ar-SA')} سعرة). امتلأت طاقة وسعرات جسدك إلى ${p.calories_current.toLocaleString('ar-SA')} / 10,000 سعرة.`
        });
        this.saveState();
        this.render();
      }

      drinkWaterFromBackpack() {
        const p = this.gameState.player;
        const need = (p.water_max || 5) - (p.water_current || 0);
        if (need <= 0) {
          soundEngine.playFail();
          alert("جسدك في حالة ارتواء تام (5 / 5 وحدات ماء)! لا تشعر بالعطش.");
          return;
        }
        if ((p.backpack_water || 0) <= 0) {
          soundEngine.playFail();
          alert("قِرَب المياه في حقيبتك فارغة تماماً! اشترِ وحدات ماء من السوق الحضري.");
          return;
        }

        const take = Math.min(need, p.backpack_water);
        p.backpack_water -= take;
        p.water_current += take;
        this.syncProvisionsInventory();
        soundEngine.playSuccess();

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `💧 شربت من قِرَب مياه الحقيبة (${take} وحدة ماء). ارتوى جسدك بالكامل (${p.water_current} / 5 وحدات ماء).`
        });
        this.saveState();
        this.render();
      }

      hireRetainer(id, name, type, priceCopper, perk) {
        const p = this.gameState.player;
        const currentCopper = this.getPlayerCopper();
        if (currentCopper < priceCopper) {
          soundEngine.playFail();
          alert("المال الذي تحمله لا يكفي للتعاقد مع هذا المرافق!");
          return;
        }

        const w = this.gameState.world_state;
        if (w.market_stock && w.market_stock.labor) {
          const found = w.market_stock.labor.find(it => it.id === id);
          if (found && found.stock > 0) found.stock -= 1;
        }

        soundEngine.playSuccess();
        this.deductCopper(priceCopper);

        p.retainers = p.retainers || [];
        p.retainers.push({ id, name, type, perk });

        if (id.includes('porter')) {
          p.carry_weight_max += 25;
        }

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🤝 أتممت التعاقد رسمياً مع [${name}]. انضم إليك المرافق بموجب صك قانوني معتمد.\nالميزة الحصرية: ${perk}.`
        });
        this.recordSummary(`تعاقد اللاعب مع مرافق جديد (${name}) في [${p.current_landmark}].`, 'trade');

        this.saveState();
        this.render();
      }

      sellInventoryItem(itemId, priceCopper) {
        const p = this.gameState.player;
        const idx = (p.inventory || []).findIndex(i => (i.id === itemId || i.item === itemId));
        if (idx === -1) return;

        soundEngine.playSuccess();
        const it = p.inventory[idx];
        it.qty = (it.qty || 1) - 1;
        if (it.qty <= 0) p.inventory.splice(idx, 1);

        this.addCopper(priceCopper);
        this.syncProvisionsInventory();
        this.recordSummary(`قام اللاعب ببيع بعض المقتنيات والأغراض في سوق [${p.current_landmark}].`, 'trade');

        this.saveState();
        this.render();
      }

      consumeItem(itemId) {
        if (itemId === 'res_calories' || itemId === 'سعرات حرارية') {
          this.feedBodyFromBackpack();
          return;
        }
        if (itemId === 'res_water' || itemId === 'وحدات ماء') {
          this.drinkWaterFromBackpack();
          return;
        }

        const p = this.gameState.player;
        const idx = (p.inventory || []).findIndex(i => (i.id === itemId || i.item === itemId));
        if (idx === -1) return;

        soundEngine.playSuccess();
        const it = p.inventory[idx];
        const hp = it.hp || (it.desc && it.desc.includes('شفاء') ? 45 : 30);

        if (hp > 0) {
          p.hp_current = Math.min(p.hp_max, p.hp_current + hp);
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `🧪 استخدمت [${it.item || it.name}] وتداويت به. استعدت +${hp} نقطة صحة (${p.hp_current} / ${p.hp_max} HP).`
          });
        }

        it.qty = (it.qty || 1) - 1;
        if (it.qty <= 0) p.inventory.splice(idx, 1);

        this.syncProvisionsInventory();
        this.saveState();
        this.render();
      }

      async submitUserInput() {
        const input = document.getElementById('user-input');
        if (!input) return;
        const val = input.value.trim();
        if (!val) return;

        soundEngine.playClick();
        input.value = '';

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `> ${val}`
        });

        this.isGenerating = true;
        this.render();

        let clientDaysPassed = 0;
        if (/نوم|أنام|مبيت|نزل|فندق/i.test(val)) clientDaysPassed = 1;
        else if (/يومين|يومان/i.test(val)) clientDaysPassed = 2;
        else if (/3 أيام|ثلاثة أيام/i.test(val)) clientDaysPassed = 3;
        else if (/أسبوع/i.test(val)) clientDaysPassed = 7;

        try {
          const res = await fetch('/api/narrate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: val, gameState: this.gameState })
          });

          if (res.ok) {
            const data = await res.json();
            const reply = data.content || data.narrative || '';
            const updates = data.updates || {};

            const daysPassed = updates.daysPassed || clientDaysPassed || 0;
            if (daysPassed > 0) {
              this.advanceGameDays(daysPassed, "أحداث القصة", /نوم|مبيت|نزل|فندق/i.test(val));
            }

            const cleanText = reply.replace(/```json[\s\S]*?```/g, '').trim();

            this.gameState.story_log.push({
              turn: this.gameState.world_state.turn,
              day: this.gameState.world_state.day,
              text: cleanText || "مضت الوقائع وبلغت مرادك في أرجاء القارة."
            });

            // Save concise round summary (mandatory 1-2 lines) into story summary memory
            const roundSummary = data.summary || `قام اللاعب بـ: "${val}".`;
            this.recordSummary(roundSummary, 'chat');
          } else {
            throw new Error("Server API offline");
          }
        } catch (e) {
          if (clientDaysPassed > 0) {
            this.advanceGameDays(clientDaysPassed, "أحداث القصة", /نوم|مبيت|نزل|فندق/i.test(val));
          }
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `استجابت وقائع [${this.gameState.player.current_landmark}] لقرارك.\nعبرت ساعات اليوم بهدوء وتأمل، محققاً خطوتك في أرجاء القارة بسلام.`
          });
          this.recordSummary(`قام اللاعب بـ: "${val}" في أرجاء [${this.gameState.player.current_landmark}].`, 'chat');
        } finally {
          this.isGenerating = false;
          this.saveState();
          this.render();
          const container = document.getElementById('messages-container');
          if (container) container.scrollTop = container.scrollHeight;
        }
      }

      exportJson() {
        soundEngine.playSuccess();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.gameState, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `grim_soil_save_day_${this.gameState.world_state.day}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      importJson(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && parsed.player && parsed.world_state) {
              soundEngine.playSuccess();
              this.gameState = parsed;
              this.saveState();
              this.render();
              alert("تم استيراد ملف الحفظ بنجاح!");
            }
          } catch(err) {
            soundEngine.playFail();
            alert("الملف غير صالح!");
          }
        };
        reader.readAsText(file);
      }

      saveToSlot(slot) {
        soundEngine.playSuccess();
        localStorage.setItem(`grim_soil_${slot}_state`, JSON.stringify(this.gameState));
        this.render();
      }

      loadFromSlot(slot) {
        soundEngine.playSuccess();
        this.activeSlot = slot;
        this.gameState = this.loadState(slot);
        this.render();
      }

      toggleSound() {
        soundEngine.toggleMute();
        this.render();
      }
    }

    window.game = new GrimSoilGame();
    window.addEventListener('DOMContentLoaded', () => {
      window.game.render();
    });
  </script>
</body>
</html>

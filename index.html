  <!-- Audio Synthesizer Script -->
  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = localStorage.getItem('grim_soil_muted') === 'true';
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        localStorage.setItem('grim_soil_muted', this.muted);
        return this.muted;
      }
      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playBreakthrough() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.35);
        });
      }
      playSuccess() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      playFail() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    }
    const soundEngine = new SoundEngine();

    function toggleFullscreen() {
      soundEngine.playClick();
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function currencyToCopper(curr) {
      if (!curr) return 0;
      return (Number(curr.G) || 0) * 10000 + (Number(curr.S) || 0) * 100 + (Number(curr.C) || 0);
    }

    function copperToCurrency(copper) {
      const c = Math.max(0, Math.floor(Number(copper) || 0));
      const G = Math.floor(c / 10000);
      const rem = c % 10000;
      const S = Math.floor(rem / 100);
      const C = rem % 100;
      return { G, S, C };

    function checkTransportAvailability(player, mode, dist, currentLm) {
      if (!mode) return { available: false, locked: false, reason: 'وسيلة غير معروفة', cost: 0 };
      
      // 1. Level Requirement Check
      if (player.level < mode.minLevel) {
        return {
          available: false,
          locked: true,
          reason: `🔒 مقفل لمستواك: [${mode.name}] يتطلب بلوغ المستوى ${mode.minLevel}+ وصقل مسارات التشي (مستواك الحالي: ${player.level})`,
          cost: 0
        };
      }

      // 2. Flying Sword specific equipment check
      if (mode.id === 'flying_sword') {
        const ownsSpiritualSword = (player.inventory || []).some(i => (i.id && i.id.includes('flying_sword')) || (i.item && (i.item.includes('سيف روحي') || i.item.includes('سيف روحاني')))) ||
                                   (player.weapon_equipped && (player.weapon_equipped.includes('روحي') || player.weapon_equipped.includes('سيف روحاني')));
        if (!ownsSpiritualSword) {
          return {
            available: false,
            locked: true,
            reason: `🔒 مقفل: تحليق بالسيف الروحي يتطلب امتلاك سيف روحاني أصيل في حقيبتك أو متقلداً بيدك!`,
            cost: 0
          };
        }
      }

      // 3. Caravan Departure Route Check
      if (mode.id === 'caravan') {
        if (currentLm && !currentLm.isUrban) {
          return {
            available: false,
            locked: true,
            reason: `⛔ لا توجد قوافل تجارية في البراري المهجورة! القوافل تنطلق حصرياً من المدن والواحات الحضرية.`,
            cost: 0
          };
        }
        const caravanFare = Math.max(20, Math.round(dist * mode.copperPerKm));
        const playerCopper = currencyToCopper(player.currency);
        if (playerCopper < caravanFare) {
          return {
            available: false,
            locked: false,
            reason: `⚠️ عجز مالي: تذكرة القافلة (${caravanFare.toLocaleString('ar-SA')} نحاس) تتجاوز نقودك (${playerCopper.toLocaleString('ar-SA')} نحاس). القوافل لا تنقل أحداً بالمجان!`,
            cost: caravanFare
          };
        }
        return { available: true, locked: false, reason: '', cost: caravanFare };
      }

      // 4. Horse Ownership & Rental Check
      if (mode.id === 'horse') {
        const ownsHorse = player.mount === 'horse' || (player.inventory || []).some(i => i.id === 'mount_horse' || (i.item && (i.item.includes('جواد') || i.item.includes('حصان'))));

    function getDistance(lm1Name, lm2Name) {
      const a = LANDMARKS.find(l => l.name === lm1Name);
      const b = LANDMARKS.find(l => l.name === lm2Name);
      if (!a || !b) return 50;
      const dx = (a.x - b.x) / 10;
      const dy = (a.y - b.y) / 10;
      return Math.max(15, Math.round(Math.sqrt(dx * dx + dy * dy)));
    }

    function getItemCalorieValue(item) {
      if (!item) return 0;
      if (item.calories && item.calories > 0) return item.calories;
      const name = (item.item || item.name || '').toLowerCase();
      if (name.includes('ميرة سفر كبرى') || name.includes('وليمة')) return 12000;
      if (name.includes('ميرة سفر') || name.includes('زاد سفر')) return 3500;
      if (name.includes('وجبة حساء') || name.includes('لحم مقدد') || name.includes('ثريد')) return 1200;
      if (name.includes('سمك مجفف') || name.includes('لحم غزال') || name.includes('شواء')) return 1500;
      if (name.includes('تمر') || name.includes('رغيف') || name.includes('كعك')) return 400;
      if (name.includes('طعام') || name.includes('مؤن')) return 1000;
      return 0;
    }


    function calculateSurvivalDays(player, inventory) {
      let p = player;
      if (Array.isArray(player)) {
        p = (window.game && window.game.gameState && window.game.gameState.player) || {};
      }
      const bodyCal = (p && typeof p.calories_current === 'number') ? p.calories_current : 8000;
      const bagCal = (p && typeof p.backpack_calories === 'number') ? p.backpack_calories : 0;
      const totalCalories = bodyCal + bagCal;
      const foodDays = Math.max(0, Math.floor(totalCalories / 2000));

      const bodyWater = (p && typeof p.water_current === 'number') ? p.water_current : 5;
      const bagWater = (p && typeof p.backpack_water === 'number') ? p.backpack_water : 0;
      const totalWater = bodyWater + bagWater;
      const waterDays = Math.max(0, Math.floor(totalWater / 2));

      return { bodyCal, bagCal, totalCalories, foodDays, bodyWater, bagWater, totalWater, waterDays, totalInvCal: bagCal, totalInvWater: bagWater };
    }

    // Procedural Rank Promotion Trial Generator: Matches Target Rank Tier & Cosmic Trade Scale
    function generatePromotionExam(factionId, targetRankIndex, playerLevel) {
      const f = INITIAL_FACTIONS[factionId];
      if (!f || !f.ranks || !f.ranks[targetRankIndex]) return null;
      const targetRank = f.ranks[targetRankIndex];

      let reqItem = "وجبة حساء لحم مقدد وثريد";
      let reqQty = 2;
      let feeCopper = 50;

      if (targetRankIndex === 1) { // Rank 2
        reqItem = (f.alignment === 'righteous') ? "جرعة عشبية لترميم الجراح" : (f.alignment === 'evil') ? "ترياق سموم الأهوار الأخضر" : "ترس خشبي صلب مدعم بصفائح الحديد";
        reqQty = 2;
        feeCopper = 100;
      } else if (targetRankIndex <= 3) { // Rank 3-4
        reqItem = (f.alignment === 'kingdom') ? "سيف قتال فولاذي دمشقي مستقيم" : "قميص زرد فولاذي متشابك الحلقات";
        reqQty = 1;
        feeCopper = 250;
      } else if (targetRankIndex <= 6) { // Rank 5-7
        reqItem = "إكسير اللوتس الثلجي الجبلي المعتق";
        reqQty = 1;
        feeCopper = 500;
      } else { // High Elders & Supreme Commanders
        reqItem = "حبة التطهير النخاعية الكبرى";
        reqQty = 1;
        feeCopper = 1000;
      }

      return {
        id: `exam_promote_${factionId}_r${targetRankIndex}`,
        factionId,
        targetRankIndex,
        targetRankName: targetRank.name,
        minLevel: targetRank.minLevel,
        perks: targetRank.perks,
        title: `اختبار الترقية إلى رتبة [${targetRank.name}]`,
        desc: `للارتقاء إلى رتبة [${targetRank.name}] بـ [${f.name}]، يُشترط إثبات صقل التشي بمستوى ${targetRank.minLevel}+، وتوريد [${reqItem} ×${reqQty}] لمخازن الشيوخ، مع سداد رسوم الترقية الرسمية (${feeCopper.toLocaleString('ar-SA')} نحاس).`,
        requiredItem: reqItem,
        requiredQty: reqQty,
        feeCopper: feeCopper,
        rewardXp: 80 + (targetRankIndex * 20)
      };
    }

  <script>
    class GrimSoilGame {
      constructor() {
        this.activeSlot = 'slot_1';
        this.gameState = this.loadState(this.activeSlot);
        this.inGame = false;
        this.currentView = 'chat'; // 'chat' | 'map'
        this.activeModal = null; // 'status' | 'inventory' | 'market' | 'politics' | 'tradescale' | 'saves' | 'spawns' | 'menu'
        this.selectedTravelTarget = null;
        this.selectedTransport = 'foot';
        this.selectedFaction = null;
        this.marketCategory = 'food'; // 'food' | 'water' | 'potions' | 'weapons' | 'labor' | 'special' | 'sell'
        this.tradeScaleSearch = '';
        this.isGenerating = false;

        // Map Pan and Zoom State
        this.mapScale = 0.055;
        this.mapOffset = { x: 0, y: 0 };
        this.mapDragging = false;
        this.mapDragStart = { x: 0, y: 0 };
        this.pinchActive = false;

        // Tab scroll retention & inventory filter
        this.marketTabsScrollLeft = 0;
        this.factionTabsScrollLeft = 0;
        this.inventoryFilter = 'all'; // 'all' | 'gear' | 'food' | 'potions'
      }

      getPlayerCopper() {
        const p = this.gameState.player;
        if (!p) return 0;
        p.currency = p.currency || { G: 0, S: 0, C: 0 };
        return Math.max(0, (Number(p.currency.G) || 0) * 10000 + (Number(p.currency.S) || 0) * 100 + (Number(p.currency.C) || 0));
      }

      setPlayerCopper(totalCopper) {
        const p = this.gameState.player;
        if (!p) return;
        const c = Math.max(0, Math.floor(Number(totalCopper) || 0));
        const G = Math.floor(c / 10000);
        const rem = c % 10000;
        const S = Math.floor(rem / 100);
        const C = rem % 100;
        p.currency = { G, S, C };
      }

      addCopper(amount) {
        const cur = this.getPlayerCopper();
        this.setPlayerCopper(cur + Math.max(0, Number(amount) || 0));
      }

      deductCopper(amount) {
        const cur = this.getPlayerCopper();
        const amt = Math.max(0, Number(amount) || 0);
        if (cur < amt) return false;
        this.setPlayerCopper(cur - amt);
        return true;
      }

      ensureEquipmentStructure(p) {
        if (!p) return;
        if (!p.equipment || typeof p.equipment !== 'object') {
          p.equipment = {
            head: null,
            chest: p.armor_equipped ? { id: 'eq_chest', name: p.armor_equipped, damage: 0, defense: 2, slot: 'chest', weight: 1.5, desc: 'درع الجسد المجهز' } : null,
            legs: null,
            hand1: p.weapon_equipped ? { id: 'eq_hand1', name: p.weapon_equipped, damage: 4, defense: 0, slot: 'hand', hands: 1, weight: 1.0, desc: 'سلاح اليد المجهز' } : null,
            hand2: null
          };
        }
        if (!('head' in p.equipment)) p.equipment.head = null;
        if (!('chest' in p.equipment)) p.equipment.chest = null;
        if (!('legs' in p.equipment)) p.equipment.legs = null;
        if (!('hand1' in p.equipment)) p.equipment.hand1 = null;
        if (!('hand2' in p.equipment)) p.equipment.hand2 = null;

        // Ensure 2H locking consistency
        if (p.equipment.hand1 && p.equipment.hand1.hands === 2) {
          if (!p.equipment.hand2 || !p.equipment.hand2.isTwoHandedLock) {
            p.equipment.hand2 = {
              id: p.equipment.hand1.id,
              name: p.equipment.hand1.name,
              isTwoHandedLock: true,
              parentSlot: 'hand1',
              desc: 'مشغولة: يحمل السلاح ذي اليدين بكلتا اليدين 🤲'
            };
          }
        }
      }

      getPlayerTotalDamage(p) {
        if (!p) return 4;
        this.ensureEquipmentStructure(p);
        let dmg = p.base_damage || 4;
        const eq = p.equipment;
        if (eq.hand1 && eq.hand1.damage) dmg += eq.hand1.damage;
        if (eq.hand2 && !eq.hand2.isTwoHandedLock && eq.hand2.damage) dmg += eq.hand2.damage;
        if (eq.head && eq.head.damage) dmg += eq.head.damage;
        if (eq.chest && eq.chest.damage) dmg += eq.chest.damage;
        if (eq.legs && eq.legs.damage) dmg += eq.legs.damage;
        return dmg;
      }

      getPlayerTotalDefense(p) {
        if (!p) return 2;
        this.ensureEquipmentStructure(p);
        let def = p.defense || 2;
        const eq = p.equipment;
        if (eq.head && eq.head.defense) def += eq.head.defense;
        if (eq.chest && eq.chest.defense) def += eq.chest.defense;
        if (eq.legs && eq.legs.defense) def += eq.legs.defense;
        if (eq.hand1 && eq.hand1.defense) def += eq.hand1.defense;
        if (eq.hand2 && !eq.hand2.isTwoHandedLock && eq.hand2.defense) def += eq.hand2.defense;
        return def;
      }

      getItemEquipmentMeta(item) {
        const name = item.item || item.name || '';
        let slot = item.slot || null;
        let hands = item.hands || 1;
        let isShield = Boolean(item.isShield);
        let isEquippable = true;

        if (item.id === 'res_calories' || item.id === 'res_water' || name === 'سعرات حرارية' || name === 'وحدات ماء' || item.category === 'food' || item.category === 'water' || item.category === 'labor' || name.includes('صك')) {
          return { isEquippable: false };
        }

        if (slot) {
          isShield = Boolean(item.isShield) || name.includes('ترس');
        } else if (name.includes('خوذة') || name.includes('طاقية') || name.includes('عصابة تشي') || name.includes('تاج') || name.includes('رأس')) {
          slot = 'head';
        } else if (name.includes('درع صفائحي') || name.includes('قميص زرد') || name.includes('درع صدري') || name.includes('عباءة') || name.includes('رداء') || name.includes('حزام ودرع') || name.includes('درع التنين')) {
          slot = 'chest';
        } else if (name.includes('صفائح حماية الأرجل') || name.includes('أرجل') || name.includes('ساق') || name.includes('بنطال') || name.includes('أحذية') || name.includes('لفائف ساق')) {
          slot = 'legs';
        } else if (name.includes('ترس') || name.includes('درع برج') || name.includes('درع الحارس الدائري')) {
          slot = 'hand';
          hands = 1;
          isShield = true;
        } else if (name.includes('بيدين') || name.includes('سيف كبير') || name.includes('عظيم') || name.includes('كولوسال') || name.includes('كلايمور') || name.includes('قوس مركب') || name.includes('قوس الحرب') || name.includes('قوس وسهم') || name.includes('رمح حربي ثقيل') || name.includes('عصا أركان الكبرى')) {
          slot = 'hand';
          hands = 2;
        } else if (name.includes('كروس بو') || name.includes('نشاب يدوي') || name.includes('سيف') || name.includes('شمشير') || name.includes('خنجر') || name.includes('سكين') || name.includes('عصا سحر') || name.includes('هراوة') || name.includes('فأس')) {
          slot = 'hand';
          hands = 1;
        } else if (item.damage > 0) {
          slot = 'hand';
          hands = item.damage >= 28 ? 2 : 1;
        } else if (item.defense > 0) {
          slot = 'chest';
        } else {
          isEquippable = false;
        }

        return {
          isEquippable,
          slot,
          hands,
          isShield,
          typeLabel: slot === 'head' ? 'درع رأس وخوذة' :
                     slot === 'chest' ? 'درع جسم ورداء' :
                     slot === 'legs' ? 'درع أرجل وأحذية' :
                     hands === 2 ? 'سلاح ثقيل (يشغل كلتا اليدين 2H)' :
                     isShield ? 'ترس دفاعي (يد واحدة 1H)' :
                     name.includes('كروس بو') || name.includes('نشاب') ? 'كروس بو سريع (يد واحدة 1H)' :
                     name.includes('عصا') ? 'عصا سحر باطنية (يد واحدة 1H)' :
                     'سلاح قتالي (يد واحدة 1H)'
        };
      }

      equipItem(itemId, targetSlot = 'auto') {

        const item = (p.inventory || []).find(i => (i.id === itemId || i.item === itemId || i.name === itemId));

          return;
        }

        const meta = this.getItemEquipmentMeta(item);
        if (!meta.isEquippable) {
          soundEngine.playFail();
          alert("هذا العنصر غير مخصص للتجهيز بالعتاد!");
          return;
        }

        const itemName = item.item || item.name;
        const itemDmg = item.damage || 0;
        const itemDef = item.defense || 0;
        const itemWeight = item.weight || 0.5;
        const itemDesc = item.desc || '';

        soundEngine.playSuccess();

        if (meta.slot === 'head') {
          p.equipment.head = { id: item.id || itemName, name: itemName, damage: itemDmg, defense: itemDef, weight: itemWeight, desc: itemDesc, slot: 'head' };
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `🪖 قمت بتجهيز [${itemName}] في خانة الرأس والخوذة (+${itemDef} دفاع).`
          });
        } else if (meta.slot === 'chest') {
          p.equipment.chest = { id: item.id || itemName, name: itemName, damage: itemDmg, defense: itemDef, weight: itemWeight, desc: itemDesc, slot: 'chest' };
          p.armor_equipped = itemName;
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `🛡️ قمت بتجهيز [${itemName}] في خانة درع الجسم والرداء (+${itemDef} دفاع).`
          });
        } else if (meta.slot === 'legs') {
          p.equipment.legs = { id: item.id || itemName, name: itemName, damage: itemDmg, defense: itemDef, weight: itemWeight, desc: itemDesc, slot: 'legs' };
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `👖 قمت بتجهيز [${itemName}] في خانة درع الأرجل والأحذية (+${itemDef} دفاع).`
          });
        } else if (meta.slot === 'hand') {
          if (meta.hands === 2) {
            p.equipment.hand1 = {
              id: item.id || itemName,
              name: itemName,
              damage: itemDmg,
              defense: itemDef,
              weight: itemWeight,
              desc: itemDesc,
              slot: 'hand',
              hands: 2
            };
            p.equipment.hand2 = {
              id: item.id || itemName,
              name: itemName,
              isTwoHandedLock: true,
              parentSlot: 'hand1',
              desc: 'مشغولة: يحمل السلاح ذي اليدين بكلتا اليدين 🤲'
            };
            p.weapon_equipped = itemName;
            this.gameState.story_log.push({
              turn: this.gameState.world_state.turn,
              day: this.gameState.world_state.day,
              text: `🤲 جهزت [${itemName}] بكلتا اليدين! سلاح ثقيل عظيم يشغل اليد 1 واليد 2 معاً (+${itemDmg} ضرر${itemDef ? `، +${itemDef} دفاع` : ''}).`
            });
          } else {
            const slotToUse = (targetSlot === 'hand2') ? 'hand2' : 'hand1';

            if (slotToUse === 'hand1') {
              if (p.equipment.hand2 && p.equipment.hand2.isTwoHandedLock) {
                p.equipment.hand2 = null;
              }
              p.equipment.hand1 = {
                id: item.id || itemName,
                name: itemName,
                damage: itemDmg,
                defense: itemDef,
                weight: itemWeight,
                desc: itemDesc,
                slot: 'hand',
                hands: 1,
                isShield: meta.isShield
              };
              p.weapon_equipped = itemName;
              this.gameState.story_log.push({
                turn: this.gameState.world_state.turn,
                day: this.gameState.world_state.day,
                text: `⚔️ قمت بتجهيز [${itemName}] في اليد 1 (${meta.typeLabel}).`
              });
            } else {
              if (p.equipment.hand1 && p.equipment.hand1.hands === 2) {
                p.equipment.hand1 = null;
              }
              p.equipment.hand2 = {
                id: item.id || itemName,
                name: itemName,
                damage: itemDmg,
                defense: itemDef,
                weight: itemWeight,
                desc: itemDesc,
                slot: 'hand',
                hands: 1,
                isShield: meta.isShield
              };
              this.gameState.story_log.push({
                turn: this.gameState.world_state.turn,
                day: this.gameState.world_state.day,
                text: `🛡️ قمت بتجهيز [${itemName}] في اليد 2 (${meta.typeLabel}).`
              });
            }
          }
        }

        this.saveState();
        this.render();
      }

      unequipSlot(slotKey) {
        const p = this.gameState.player;
        this.ensureEquipmentStructure(p);
        soundEngine.playClick();

        let removedName = '';
        if (slotKey === 'hand1') {
          if (p.equipment.hand1) {
            removedName = p.equipment.hand1.name;
            if (p.equipment.hand1.hands === 2) {
              p.equipment.hand2 = null;
            }
            p.equipment.hand1 = null;
            if (p.weapon_equipped === removedName) p.weapon_equipped = '';
          }
        } else if (slotKey === 'hand2') {
          if (p.equipment.hand2) {
            if (p.equipment.hand2.isTwoHandedLock) {
              removedName = p.equipment.hand1 ? p.equipment.hand1.name : 'السلاح ذو اليدين';
              p.equipment.hand1 = null;
              p.equipment.hand2 = null;
              if (p.weapon_equipped === removedName) p.weapon_equipped = '';
            } else {
              removedName = p.equipment.hand2.name;
              p.equipment.hand2 = null;
            }
          }
        } else if (slotKey === 'head') {
          if (p.equipment.head) {
            removedName = p.equipment.head.name;
            p.equipment.head = null;
          }
        } else if (slotKey === 'chest') {
          if (p.equipment.chest) {
            removedName = p.equipment.chest.name;
            p.equipment.chest = null;
            if (p.armor_equipped === removedName) p.armor_equipped = '';
          }
        } else if (slotKey === 'legs') {
          if (p.equipment.legs) {
            removedName = p.equipment.legs.name;
            p.equipment.legs = null;
          }
        }

        if (removedName) {
          this.gameState.story_log.push({
            turn: this.gameState.world_state.turn,
            day: this.gameState.world_state.day,
            text: `نزعت [${removedName}] وأعدته إلى حقيبة السفر.`
          });
        }

        this.saveState();
        this.render();
      }

      setInventoryFilter(tab) {
        soundEngine.playClick();
        this.inventoryFilter = tab;
        this.render();
      }

      loadState(slot) {
        const raw = localStorage.getItem(`grim_soil_${slot}_state`);
        if (raw) {
          try {
            const state = JSON.parse(raw);
            const p = state && state.player;
            if (p) {
              p.currency = p.currency || { G: 0, S: 0, C: 0 };
              p.currency = {
                G: Math.max(0, Math.floor(Number(p.currency.G) || 0)),
                S: Math.max(0, Math.floor(Number(p.currency.S) || 0)),
                C: Math.max(0, Math.floor(Number(p.currency.C) || 0))
              };
              if (typeof p.backpack_calories !== 'number') p.backpack_calories = 6000;
              if (typeof p.backpack_calories_max !== 'number') p.backpack_calories_max = 25000;
              if (typeof p.water_current !== 'number') p.water_current = 5;
              if (typeof p.water_max !== 'number') p.water_max = 5;
              if (typeof p.backpack_water !== 'number') p.backpack_water = 6;
              if (typeof p.backpack_water_max !== 'number') p.backpack_water_max = 20;
              if (typeof p.daily_duels !== 'number') p.daily_duels = 0;
              if (typeof p.daily_meditate !== 'number') p.daily_meditate = 0;
              this.ensureEquipmentStructure(p);
            }
            if (!Array.isArray(state.story_summary)) {
              state.story_summary = [
                {
                  turn: 1,
                  day: (state.world_state && state.world_state.day) || 1,
                  text: `بدأت رحلتك في أرجاء [${(p && p.current_landmark) || 'المدينة العظيمة'}] كمسافر يخطو أولى خطواته في عالم التربة القاتمة.`,
                  type: 'start'
                }
              ];
            }
            return state;
          } catch (e) {}
        }
        return createInitialState();
      }

      recordSummary(text, type = 'event') {
        if (!text) return;
        this.gameState.story_summary = this.gameState.story_summary || [];
        const turn = (this.gameState.world_state && this.gameState.world_state.turn) || 1;
        const day = (this.gameState.world_state && this.gameState.world_state.day) || 1;
        this.gameState.story_summary.push({
          turn,
          day,
          text: text.trim(),
          type
        });
      }

      syncProvisionsInventory() {
        const p = this.gameState.player;
        p.backpack_calories = Math.max(0, p.backpack_calories || 0);
        p.backpack_water = Math.max(0, p.backpack_water || 0);
        p.inventory = p.inventory || [];

        let calItem = p.inventory.find(i => i.id === 'res_calories' || i.item === 'سعرات حرارية');
        if (p.backpack_calories > 0) {
          const w = Math.round((p.backpack_calories / 1000) * 0.4 * 10) / 10;
          if (calItem) {
            calItem.qty = p.backpack_calories;
            calItem.weight = w;
            calItem.desc = `زاد مؤن وسعرات حرارية مخزنة بالحقيبة (${p.backpack_calories.toLocaleString('ar-SA')} / ${(p.backpack_calories_max || 25000).toLocaleString('ar-SA')} سعرة).`;
          } else {
            p.inventory.unshift({
              id: 'res_calories',
              item: 'سعرات حرارية',
              qty: p.backpack_calories,
              unit: 'سعرة',
              weight: w,
              desc: `زاد مؤن وسعرات حرارية مخزنة بالحقيبة (${p.backpack_calories.toLocaleString('ar-SA')} / ${(p.backpack_calories_max || 25000).toLocaleString('ar-SA')} سعرة).`
            });
          }
        } else if (calItem) {
          const idx = p.inventory.indexOf(calItem);
          if (idx !== -1) p.inventory.splice(idx, 1);
        }

        let waterItem = p.inventory.find(i => i.id === 'res_water' || i.item === 'وحدات ماء');
        if (p.backpack_water > 0) {
          const w = Math.round(p.backpack_water * 0.5 * 10) / 10;
          if (waterItem) {
            waterItem.qty = p.backpack_water;
            waterItem.weight = w;
            waterItem.desc = `قِرَب مياه شرب نقية للمسير والارتواء (${p.backpack_water} / ${(p.backpack_water_max || 20)} وحدة ماء).`;
          } else {
            p.inventory.unshift({
              id: 'res_water',
              item: 'وحدات ماء',
              qty: p.backpack_water,
              unit: 'وحدة',
              weight: w,
              desc: `قِرَب مياه شرب نقية للمسير والارتواء (${p.backpack_water} / ${(p.backpack_water_max || 20)} وحدة ماء).`
            });
          }
        } else if (waterItem) {
          const idx = p.inventory.indexOf(waterItem);
          if (idx !== -1) p.inventory.splice(idx, 1);
        }

        let totalW = 0;
        p.inventory.forEach(it => {
          if (it.id === 'res_calories') totalW += (it.weight || 0);
          else if (it.id === 'res_water') totalW += (it.weight || 0);
          else totalW += (it.weight || 0.5) * (it.qty || 1);
        });
        p.carry_weight_current = Math.round(totalW * 10) / 10;
      }

      saveState() {
        localStorage.setItem(`grim_soil_${this.activeSlot}_state`, JSON.stringify(this.gameState));
      }

      render() {
        const root = document.getElementById('app');
        if (!this.inGame) {
          root.innerHTML = this.renderTitleScreen();
        } else {
          root.innerHTML = `
            ${this.renderHeader()}
            ${this.currentView === 'map' ? this.renderFullScreenMap() : this.renderChatArea()}
            ${this.renderBottomNav()}
            ${this.renderActiveModal()}
          `;
          if (this.currentView === 'map') {
            this.attachFullScreenCanvas();
          }

          if (this.activeModal === 'market') {
            const tabsEl = document.getElementById('market-categories-tabs');
            if (tabsEl) {
              if (this.marketTabsScrollLeft !== undefined) {
                tabsEl.scrollLeft = this.marketTabsScrollLeft;
              }
              const activeBtn = tabsEl.querySelector(`[data-cat="${this.marketCategory}"]`);
              if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
              }
            }
          }

          if (this.activeModal === 'politics') {
            const fTabsEl = document.getElementById('faction-tabs-bar');
            if (fTabsEl && this.factionTabsScrollLeft !== undefined) {
              fTabsEl.scrollLeft = this.factionTabsScrollLeft;
            }
          }
        }
      }

                  <span>متابعة المغامرة</span>
                  <span>▶</span>
                </button>
              ` : ''}
              <button onclick="window.game.openModal('spawns')" class="w-full py-3 dark-btn text-xs font-bold text-amber-300 hover:border-amber-500">
                بدء مغامرة جديدة (اختيار موطن)

              <button onclick="window.game.openModal('tradescale')" class="w-full py-2.5 dark-btn text-xs text-yellow-400">

      switchView(viewName) {
        soundEngine.playClick();
        this.currentView = viewName;
        this.activeModal = null;

      }

      renderFullScreenMap() {
        const p = this.gameState.player;
        const w = this.gameState.world_state;
        const currentLm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];
        const targetLm = this.selectedTravelTarget ? LANDMARKS.find(l => l.name === this.selectedTravelTarget) : null;
        const dist = targetLm ? getDistance(currentLm.name, targetLm.name) : 0;
        const transport = TRANSPORT_MODES.find(m => m.id === this.selectedTransport) || TRANSPORT_MODES[0];
        const transportCheck = checkTransportAvailability(p, transport, dist, currentLm);
        const daysRequired = dist > 0 ? Math.max(1, Math.ceil(dist / transport.kmPerDay)) : 0;
        const totalCaloriesNeeded = daysRequired * transport.caloriesPerDay;
        const totalWaterNeeded = Math.round(daysRequired * transport.waterUnitsPerDay * 10) / 10;
        const totalAvailCal = (p.calories_current || 0) + (p.backpack_calories || 0);
        const totalAvailWater = (p.water_current || 0) + (p.backpack_water || 0);
        const playerCopper = currencyToCopper(p.currency);
        const hasEnoughCalories = totalAvailCal >= totalCaloriesNeeded;
        const hasEnoughWater = totalAvailWater >= totalWaterNeeded;
        const hasEnoughMoney = playerCopper >= transportCheck.cost;
        const isUnlocked = !transportCheck.locked;
        const canTravel = dist > 0 && hasEnoughCalories && hasEnoughWater && hasEnoughMoney && isUnlocked;

        return `
          <div class="relative flex-1 w-full h-full bg-[#050507] overflow-hidden select-none">
            <canvas id="fullscreen-map-canvas" class="w-full h-full cursor-grab active:cursor-grabbing block touch-none"></canvas>

            <div class="absolute top-3 left-3 flex flex-col gap-1.5 z-20">
              <button onclick="window.game.zoomMap(1.25)" class="w-9 h-9 dark-btn rounded-xl flex items-center justify-center font-bold text-amber-300 text-sm shadow-xl" title="تكبير">+</button>
              <button onclick="window.game.zoomMap(0.8)" class="w-9 h-9 dark-btn rounded-xl flex items-center justify-center font-bold text-amber-300 text-sm shadow-xl" title="تصغير">-</button>
              <button onclick="window.game.centerMapOnPlayer()" class="w-9 h-9 gold-btn rounded-xl flex items-center justify-center text-xs shadow-xl" title="تمركز على موقعي">🎯</button>
            </div>

            <div class="absolute top-3 right-3 bg-neutral-950/90 border border-neutral-800 backdrop-blur-md rounded-xl p-2.5 text-[10px] space-y-1.5 z-20 pointer-events-none shadow-xl">
              <div class="flex items-center gap-1.5 text-amber-400 font-bold">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_8px_#f59e0b]"></span>
                <span>مناطق حضرية (أسواق ومبيت)</span>
              </div>
              <div class="flex items-center gap-1.5 text-neutral-400">
                <span class="w-2.5 h-2.5 rounded-full bg-neutral-600"></span>
                <span>مناطق برية (مهالك وبدون أسواق)</span>
              </div>
              <div class="text-[9px] text-neutral-500 pt-0.5 border-t border-neutral-800 font-serif">
                👆 اضغط معلماً للسفر · كبّر بأصابعك 🤏
              </div>
            </div>

            ${targetLm ? `

                        ${!hasEnoughCalories ? `<span class="text-red-400 mr-1">[عجز ${(totalCaloriesNeeded - totalAvailCal).toLocaleString('ar-SA')}]</span>` : '✓'}

                        ` : `
                          ⚠️ <strong>عجز في المؤن:</strong> زاد السفر لا يكفي لقطع ${dist} كم على مدار ${daysRequired} أيام! اشترِ سعرات أو وحدات ماء من السوق لتفادي الهلاك في البرية.

      selectTransport(modeId) {
        soundEngine.playClick();
        const mode = TRANSPORT_MODES.find(m => m.id === modeId);
        const p = this.gameState.player;
        const currentLm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];
        const chk = checkTransportAvailability(p, mode, 50, currentLm);
        if (chk.locked) {
          soundEngine.playFail();
          alert(chk.reason);
          return;
        }
        this.selectedTransport = modeId;
        this.render();
      }

      zoomMap(factor) {
        soundEngine.playClick();
        this.mapScale = Math.max(0.025, Math.min(0.20, this.mapScale * factor));
        const canvas = document.getElementById('fullscreen-map-canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          this.drawFullScreenMap(ctx, canvas.width, canvas.height);
        }
      }

      centerMapOnPlayer() {
        soundEngine.playClick();
        const p = this.gameState.player;
        const lm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];
        const canvas = document.getElementById('fullscreen-map-canvas');
        if (canvas) {
          this.mapOffset.x = (canvas.width / 2) - (lm.x * this.mapScale);
          this.mapOffset.y = (canvas.height / 2) - (lm.y * this.mapScale);
          const ctx = canvas.getContext('2d');
          this.drawFullScreenMap(ctx, canvas.width, canvas.height);
        }
      }

      attachFullScreenCanvas() {
        const canvas = document.getElementById('fullscreen-map-canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        const ctx = canvas.getContext('2d');

        if (this.mapOffset.x === 0 && this.mapOffset.y === 0) {
          const p = this.gameState.player;
          const lm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];
          this.mapOffset.x = (canvas.width / 2) - (lm.x * this.mapScale);
          this.mapOffset.y = (canvas.height / 2) - (lm.y * this.mapScale);
        }

        this.drawFullScreenMap(ctx, canvas.width, canvas.height);

        let pinchStartDist = 0;
        let pinchStartScale = this.mapScale;
        let pinchMid = { x: 0, y: 0 };
        let pinchStartOffset = { x: 0, y: 0 };
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        canvas.ontouchstart = (e) => {
          if (e.touches.length === 2) {
            this.mapDragging = false;
            this.pinchActive = true;
            pinchStartDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            pinchStartScale = this.mapScale;
            pinchMid = {
              x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
              y: (e.touches[0].clientY + e.touches[1].clientY) / 2
            };
            pinchStartOffset = { x: this.mapOffset.x, y: this.mapOffset.y };
          } else if (e.touches.length === 1) {
            this.pinchActive = false;
            this.mapDragging = true;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchMoved = false;
            this.mapDragStart = {
              x: e.touches[0].clientX - this.mapOffset.x,
              y: e.touches[0].clientY - this.mapOffset.y
            };
          }
        };

        canvas.ontouchmove = (e) => {
          if (e.touches.length === 2 && this.pinchActive && pinchStartDist > 0) {
            e.preventDefault();
            const currentDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            const factor = currentDist / pinchStartDist;
            const targetScale = Math.max(0.025, Math.min(0.20, pinchStartScale * factor));
            const cRect = canvas.getBoundingClientRect();
            const canvasMidX = pinchMid.x - cRect.left;
            const canvasMidY = pinchMid.y - cRect.top;
            const worldX = (canvasMidX - pinchStartOffset.x) / pinchStartScale;
            const worldY = (canvasMidY - pinchStartOffset.y) / pinchStartScale;
            this.mapScale = targetScale;
            this.mapOffset.x = canvasMidX - (worldX * targetScale);
            this.mapOffset.y = canvasMidY - (worldY * targetScale);
            this.drawFullScreenMap(ctx, canvas.width, canvas.height);
          } else if (e.touches.length === 1 && this.mapDragging) {
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.hypot(dx, dy) > 6) {
              touchMoved = true;
            }
            this.mapOffset.x = e.touches[0].clientX - this.mapDragStart.x;
            this.mapOffset.y = e.touches[0].clientY - this.mapDragStart.y;
            this.drawFullScreenMap(ctx, canvas.width, canvas.height);
          }
        };

        canvas.ontouchend = (e) => {
          if (this.pinchActive && e.touches.length < 2) {
            this.pinchActive = false;
          }
          if (this.mapDragging && e.touches.length === 0) {
            this.mapDragging = false;
            if (!touchMoved) {
              const cRect = canvas.getBoundingClientRect();
              const clickX = touchStartX - cRect.left;
              const clickY = touchStartY - cRect.top;
              this.handleMapTap(clickX, clickY);
            }
          }
        };

        let mouseMoved = false;
        let mouseStartX = 0;
        let mouseStartY = 0;

        canvas.onmousedown = (e) => {
          this.mapDragging = true;
          this.mapDragStart = { x: e.clientX - this.mapOffset.x, y: e.clientY - this.mapOffset.y };
          mouseMoved = false;
          mouseStartX = e.clientX;
          mouseStartY = e.clientY;
        };
        window.onmousemove = (e) => {
          if (!this.mapDragging) return;
          if (Math.hypot(e.clientX - mouseStartX, e.clientY - mouseStartY) > 5) {
            mouseMoved = true;
          }
          this.mapOffset.x = e.clientX - this.mapDragStart.x;
          this.mapOffset.y = e.clientY - this.mapDragStart.y;
          this.drawFullScreenMap(ctx, canvas.width, canvas.height);
        };
        window.onmouseup = (e) => {
          if (this.mapDragging) {
            this.mapDragging = false;
            if (!mouseMoved && e.target === canvas) {
              const cRect = canvas.getBoundingClientRect();
              const clickX = e.clientX - cRect.left;
              const clickY = e.clientY - cRect.top;
              this.handleMapTap(clickX, clickY);
            }
          }
        };

        canvas.onwheel = (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
          const cRect = canvas.getBoundingClientRect();
          const mouseX = e.clientX - cRect.left;
          const mouseY = e.clientY - cRect.top;
          const targetScale = Math.max(0.025, Math.min(0.20, this.mapScale * zoomFactor));
          const worldX = (mouseX - this.mapOffset.x) / this.mapScale;
          const worldY = (mouseY - this.mapOffset.y) / this.mapScale;
          this.mapScale = targetScale;
          this.mapOffset.x = mouseX - (worldX * targetScale);
          this.mapOffset.y = mouseY - (worldY * targetScale);
          this.drawFullScreenMap(ctx, canvas.width, canvas.height);
        };
      }

      handleMapTap(clickX, clickY) {
        let found = null;
        LANDMARKS.forEach(lm => {
          const screenX = (lm.x * this.mapScale) + this.mapOffset.x;
          const screenY = (lm.y * this.mapScale) + this.mapOffset.y;
          const dist = Math.hypot(clickX - screenX, clickY - screenY);
          if (dist < 28) {
            found = lm;
          }
        });

        if (found) {
          soundEngine.playClick();
          this.selectedTravelTarget = found.name;
          this.render();
        } else {
          if (this.selectedTravelTarget !== null) {
            soundEngine.playClick();
            this.selectedTravelTarget = null;
            this.render();
          }
        }
      }

      drawFullScreenMap(ctx, w, h) {
        ctx.fillStyle = '#070709';
        ctx.fillRect(0, 0, w, h);

        const currentLm = LANDMARKS.find(l => l.name === this.gameState.player.current_landmark) || LANDMARKS[0];
        const targetLm = this.selectedTravelTarget ? LANDMARKS.find(l => l.name === this.selectedTravelTarget) : null;

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        const gridSize = 100 * this.mapScale * 10;
        if (gridSize > 20) {
          const startX = this.mapOffset.x % gridSize;
          const startY = this.mapOffset.y % gridSize;
          ctx.beginPath();
          for (let x = startX; x < w; x += gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
          }
          for (let y = startY; y < h; y += gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(w, y);
          }
          ctx.stroke();
        }

        const regions = [
          { name: "المرتفعات الشمالية", x: 4800, y: 1500, color: "rgba(56, 189, 248, 0.06)" },
          { name: "السهول الوسطى", x: 5000, y: 4800, color: "rgba(245, 158, 11, 0.06)" },
          { name: "الصحراء الشرقية", x: 8200, y: 5200, color: "rgba(234, 179, 8, 0.06)" },
          { name: "الأراضي الرطبة الجنوبية", x: 4800, y: 8000, color: "rgba(16, 185, 129, 0.06)" },
          { name: "الساحل الغربي", x: 2000, y: 4500, color: "rgba(99, 102, 241, 0.06)" }
        ];

        regions.forEach(r => {
          const rx = (r.x * this.mapScale) + this.mapOffset.x;
          const ry = (r.y * this.mapScale) + this.mapOffset.y;
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.arc(rx, ry, 140, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.strokeStyle = '#27272a';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([5, 5]);
        LANDMARKS.forEach((lm1, i) => {
          LANDMARKS.slice(i + 1).forEach(lm2 => {
            if (getDistance(lm1.name, lm2.name) < 420) {
              const x1 = (lm1.x * this.mapScale) + this.mapOffset.x;
              const y1 = (lm1.y * this.mapScale) + this.mapOffset.y;
              const x2 = (lm2.x * this.mapScale) + this.mapOffset.x;
              const y2 = (lm2.y * this.mapScale) + this.mapOffset.y;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          });
        });
        ctx.setLineDash([]);

        if (targetLm && currentLm.name !== targetLm.name) {
          const x1 = (currentLm.x * this.mapScale) + this.mapOffset.x;
          const y1 = (currentLm.y * this.mapScale) + this.mapOffset.y;
          const x2 = (targetLm.x * this.mapScale) + this.mapOffset.x;
          const y2 = (targetLm.y * this.mapScale) + this.mapOffset.y;

          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 4]);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.setLineDash([]);

          const midX = (x1 + x2) / 2;
          const midY = (y1 + y2) / 2;
          const dKm = getDistance(currentLm.name, targetLm.name);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(midX - 35, midY - 12, 70, 24, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${dKm} كم`, midX, midY + 4);
        }

        LANDMARKS.forEach(lm => {
          const screenX = (lm.x * this.mapScale) + this.mapOffset.x;
          const screenY = (lm.y * this.mapScale) + this.mapOffset.y;
          const isCurrent = lm.name === currentLm.name;
          const isTarget = targetLm && lm.name === targetLm.name;

          if (isTarget) {
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(screenX, screenY, 26, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(245, 158, 11, 0.25)';
            ctx.beginPath();
            ctx.arc(screenX, screenY, 26, 0, Math.PI * 2);
            ctx.fill();
          }

          if (lm.isUrban) {
            ctx.fillStyle = isCurrent ? 'rgba(16, 185, 129, 0.35)' : isTarget ? 'rgba(245, 158, 11, 0.45)' : 'rgba(217, 119, 6, 0.2)';
            ctx.beginPath();
            ctx.arc(screenX, screenY, 18, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = isCurrent ? 'rgba(16, 185, 129, 0.3)' : isTarget ? 'rgba(245, 158, 11, 0.4)' : 'rgba(239, 68, 68, 0.15)';
            ctx.beginPath();
            ctx.arc(screenX, screenY, 14, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = isCurrent ? '#10b981' : isTarget ? '#f59e0b' : lm.isUrban ? '#d97706' : '#52525b';
          ctx.beginPath();
          ctx.arc(screenX, screenY, lm.isUrban ? 9 : 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = isCurrent ? '#34d399' : isTarget ? '#fbbf24' : lm.isUrban ? '#f59e0b' : '#3f3f46';
          ctx.lineWidth = isTarget ? 3 : 2;
          ctx.stroke();

          ctx.fillStyle = isCurrent ? '#34d399' : isTarget ? '#fbbf24' : lm.isUrban ? '#fde68a' : '#a1a1aa';
          ctx.font = 'bold 11px "Noto Naskh Arabic", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`${lm.icon} ${lm.name}`, screenX, screenY - 14);

          if (isCurrent) {
            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 10px "Noto Naskh Arabic", sans-serif';
            ctx.fillText('🚶 أنت هنا', screenX, screenY + 19);
          } else if (isTarget) {
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 10px "Noto Naskh Arabic", sans-serif';
            ctx.fillText('🎯 الوجهة', screenX, screenY + 19);
          } else {
            ctx.fillStyle = lm.isUrban ? 'rgba(245, 158, 11, 0.7)' : 'rgba(161, 161, 170, 0.5)';
            ctx.font = '9px "Noto Naskh Arabic", sans-serif';
            ctx.fillText(lm.isUrban ? 'حضري' : 'برية', screenX, screenY + 18);
          }
        });
      }

      renderChatArea() {
        const logs = this.gameState.story_log || [];
        const p = this.gameState.player;
        const currentLm = LANDMARKS.find(l => l.name === p.current_landmark) || LANDMARKS[0];

        return `
          <main class="flex-1 overflow-y-auto p-3.5 sm:p-4 flex flex-col justify-between max-w-3xl mx-auto w-full space-y-3">
            <div id="messages-container" class="space-y-3 pb-2">
              ${logs.map((msg) => `
                <div class="p-3.5 rounded-xl border border-neutral-800/80 bg-neutral-900/70 text-xs sm:text-sm leading-relaxed font-serif shadow-md">
                  <div class="flex items-center justify-between text-[10px] text-neutral-500 font-mono mb-2 pb-1.5 border-b border-neutral-800/60">
                    <span class="text-amber-500 font-bold">اليوم ${msg.day} · الدور ${msg.turn}</span>
                    <span class="text-neutral-400 font-serif">📍 ${p.current_landmark}</span>
                  </div>
                  <div class="text-[#e2d5c0] whitespace-pre-line">${msg.text}</div>
                </div>
              `).join('')}
              ${this.isGenerating ? `
                <div class="p-3 rounded-xl border border-amber-900/50 bg-neutral-900/40 text-xs text-amber-400 flex items-center gap-2 pulse-slow font-serif">
                  <span>⚔️</span>
                  <span>تتحرك خيوط القدر وتتشكل وقائع اللحظة...</span>
                </div>

      generateDailyMarketTab(category, landmark, day) {
        const pool = PROCEDURAL_POOLS[category];
        if (!pool) return [];

        const econ = landmark.economic_profile || { modifiers: {} };
        const catMod = (econ.modifiers && econ.modifiers[category]) || 1.0;
        const count = 18 + ((day * 7 + landmark.name.length) % 7);
        const items = [];

        for (let i = 0; i < count; i++) {
          const baseIdx = (day * 13 + i * 5) % pool.bases.length;
          const qualIdx = (day * 3 + i * 7) % pool.qualities.length;
          const base = pool.bases[baseIdx];
          const quality = pool.qualities[qualIdx];

          const seed = day * 100 + i * 17 + base.baseC;
          const variance = 0.86 + (pseudoRandom(seed) * 0.32);
          const finalCopper = Math.max(5, Math.round(base.baseC * catMod * variance));

          const itemId = `mkt_${category}_${day}_${i}`;
          const itemName = `${base.name} (${quality})`;

          const itemObj = {
            id: itemId,
            name: itemName,
            category: category,
            tierName: base.t || 'ميزان التجارة الرسمي',
            benchmarkCopper: base.baseC,
            priceCopper: finalCopper,
            desc: base.desc || `عنصر عالي الجودة (${quality}) متوفر في سوق ${landmark.name}.`,
            weight: base.w || 0.5,
            calories: base.cal || 0,
            water: base.wUnit || 0,
            hp: base.hp || 0,
            damage: base.dmg || 0,
            defense: base.def || 0,
            slot: base.slot || null,
            hands: base.hands || 1,
            isShield: Boolean(base.isShield),
            type: base.type || 'سلعة تجارية',
            perk: base.perk || '',
            isSpecial: Boolean(base.isSpecial),
            stock: base.isSpecial ? 1 : (30 + ((day + i) % 40))
          };

          items.push(itemObj);
        }

        return items;
      }

      getCityMarketInventory(landmark) {
        const w = this.gameState.world_state;
        if (w.market_day === w.day && w.market_landmark === landmark.name && w.market_stock) {
          return w.market_stock;
        }

        const generated = {
          food: this.generateDailyMarketTab('food', landmark, w.day),
          water: this.generateDailyMarketTab('water', landmark, w.day),
          potions: this.generateDailyMarketTab('potions', landmark, w.day),
          weapons: this.generateDailyMarketTab('weapons', landmark, w.day),
          labor: this.generateDailyMarketTab('labor', landmark, w.day),
          special: this.generateDailyMarketTab('special', landmark, w.day)
        };

        w.market_day = w.day;
        w.market_landmark = landmark.name;
        w.market_stock = generated;

        return generated;
      }

      renderInventoryModal() {
        const p = this.gameState.player;
        this.ensureEquipmentStructure(p);
        const eq = p.equipment;
        const totalDmg = this.getPlayerTotalDamage(p);
        const totalDef = this.getPlayerTotalDefense(p);
        const gearDmg = totalDmg - (p.base_damage || 4);
        const gearDef = totalDef - (p.defense || 2);

        const filter = this.inventoryFilter || 'all';
        const filteredItems = (p.inventory || []).filter(item => {
          if (filter === 'all') return true;
          const meta = this.getItemEquipmentMeta(item);
          if (filter === 'gear') return meta.isEquippable;
          if (filter === 'food') return item.id === 'res_calories' || item.id === 'res_water' || item.category === 'food' || item.category === 'water' || item.calories > 0 || item.water > 0;
          if (filter === 'potions') return item.category === 'potions' || item.category === 'special' || item.hp > 0 || (item.desc && (item.desc.includes('إكسير') || item.desc.includes('ترياق') || item.desc.includes('مخطوطة')));
          return true;
        });

        const isItemInSlot = (item, slotObj) => {
          if (!slotObj) return false;
          const name = item.item || item.name;
          return slotObj.id === item.id || slotObj.name === name;
        };

        const getItemEquippedSlotLabel = (item) => {
          if (isItemInSlot(item, eq.head)) return '🪖 درع الرأس';
          if (isItemInSlot(item, eq.chest)) return '🛡️ درع الجسم';
          if (isItemInSlot(item, eq.legs)) return '👖 درع الأرجل';
          if (isItemInSlot(item, eq.hand1)) return eq.hand1.hands === 2 ? '🤲 كلتا اليدين (2H)' : '⚔️ اليد 1';

                          const invItem = (p.inventory || []).find(it => (it.item === exam.requiredItem || it.name === exam.requiredItem));

                          const curCopper = currencyToCopper(p.currency);
                          const hasItems = curQty >= exam.requiredQty;
                          const hasFee = curCopper >= exam.feeCopper;

      selectFactionCategory(cat) {
        soundEngine.playClick();
        this.factionCategory = cat;
        const catFactions = Object.values(INITIAL_FACTIONS).filter(f => f.alignment === cat);
        this.selectedFaction = catFactions[0] || Object.values(INITIAL_FACTIONS)[0];
        this.render();
      }

      selectFaction(id) {
        soundEngine.playClick();
        const fTabsEl = document.getElementById('faction-tabs-bar');
        if (fTabsEl) {
          this.factionTabsScrollLeft = fTabsEl.scrollLeft;
        }
        this.selectedFaction = INITIAL_FACTIONS[id];
        this.render();
      }

      renderTradeScaleModal() {
        const filtered = TRADE_SCALE.filter(tier => {
          if (!this.tradeScaleSearch.trim()) return true;
          return tier.name.includes(this.tradeScaleSearch) ||
                 tier.examples.some(ex => ex.name.includes(this.tradeScaleSearch) || ex.desc.includes(this.tradeScaleSearch));
        });

        return `
          <div class="modal-backdrop" onclick="if(event.target===this) window.game.closeModal()">
            <div class="modal-box !max-w-4xl h-[92vh]">
              <div class="flex items-center justify-between px-4 py-3 border-b border-neutral-800 bg-neutral-900/80">
                <div class="flex items-center gap-2">
                  <span class="text-base text-yellow-500">⚖️</span>

                    <h3 class="font-bold text-amber-300 text-sm font-serif">ميزان التجارة وسلم الأسعار والرواتب الرسمي</h3>
                    <p class="text-[10px] text-neutral-400 font-mono">المرجع المعتمد لتقييم السلع والمؤن وأجور العمال والعبيد</p>

                  oninput="window.game.tradeScaleSearch = this.value; window.game.render();"
                  class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 outline-none focus:border-amber-500 font-serif"

              <div class="p-4 overflow-y-auto space-y-4 text-xs flex-1">

                  <div class="p-3.5 bg-neutral-900/70 border border-neutral-800 rounded-xl space-y-2">

                      <div class="flex items-center gap-2">
                        <span class="text-amber-400 font-bold text-sm">${tier.name}</span>
                        <span class="text-[10px] text-amber-500 font-mono">(${tier.copperValue.toLocaleString('ar-SA')} نحاسية)</span>

                          <div class="font-bold text-neutral-200 flex justify-between">
                            <span>${ex.name}</span>
                            <span class="text-[9px] text-amber-400 font-mono">${ex.category}</span>
                          </div>
                          <p class="text-[10px] text-neutral-400 mt-0.5">${ex.desc}</p>

            </div>

        `;

      renderSavesModal() {
        return `
          <div class="modal-backdrop" onclick="if(event.target===this) window.game.closeModal()">
            <div class="modal-box p-4 space-y-4">
              <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
                <h3 class="font-bold text-amber-300 text-sm font-serif">💾 إدارة التخزينات وتصدير الملفات</h3>
                <button onclick="window.game.closeModal()" class="text-neutral-400 p-1 text-sm">✕</button>
              </div>

              <div class="space-y-2.5 text-xs">
                ${['slot_1', 'slot_2', 'slot_3'].map((slot, idx) => {
                  const raw = localStorage.getItem(`grim_soil_${slot}_state`);
                  let info = 'خانة فارغة';
                  if (raw) {
                    try {
                      const d = JSON.parse(raw);
                      info = `اليوم ${d.world_state.day} · ${d.player.current_landmark} · م${d.player.level}`;
                    } catch(e) {}
                  }
                  const isCurrent = this.activeSlot === slot;
                  return `
                    <div class="p-3 bg-neutral-900/80 rounded-xl border ${isCurrent ? 'border-amber-500' : 'border-neutral-800'} flex items-center justify-between">
                      <div>
                        <strong class="text-amber-300 font-serif">خانة التخزين ${idx + 1} ${isCurrent ? '⭐ (الحالية)' : ''}</strong>
                        <div class="text-[10px] text-neutral-400 font-mono mt-0.5">${info}</div>
                      </div>
                      <div class="flex gap-1.5">
                        <button onclick="window.game.saveToSlot('${slot}')" class="px-2.5 py-1.5 gold-btn text-[10px]">حفظ</button>
                        ${raw ? `<button onclick="window.game.loadFromSlot('${slot}')" class="px-2.5 py-1.5 dark-btn text-[10px]">تحميل</button>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="pt-2 border-t border-neutral-800 flex gap-2">

                </button>
                <label class="flex-1 py-2.5 dark-btn text-xs text-center text-neutral-300 cursor-pointer">
                  📤 استيراد ملف حفظ
                  <input type="file" accept=".json" onchange="window.game.importJson(event)" class="hidden" />
                </label>
              </div>
            </div>
          </div>
        `;
      }

      advanceGameDays(days, reason = "مرور الأيام", inSafeInn = false) {
        const p = this.gameState.player;
        const w = this.gameState.world_state;
        const actualDays = Math.max(1, days);

        w.day += actualDays;
        w.turn += 1;

        p.daily_duels = 0;
        p.daily_meditate = 0;

        if (inSafeInn) {
          p.hp_current = p.hp_max;
          p.ap_current = p.ap_max;
          p.calories_current = p.calories_max;
          p.water_current = p.water_max;
          p.hunger_days = 0;
          p.thirst_days = 0;
        } else {
          let calToBurn = actualDays * 2000;
          if ((p.backpack_calories || 0) >= calToBurn) {
            p.backpack_calories -= calToBurn;
            calToBurn = 0;
          } else {
            calToBurn -= (p.backpack_calories || 0);
            p.backpack_calories = 0;
            p.calories_current = Math.max(0, (p.calories_current || 0) - calToBurn);
          }

          let waterToBurn = actualDays * 2;
          if ((p.backpack_water || 0) >= waterToBurn) {
            p.backpack_water -= waterToBurn;
            waterToBurn = 0;
          } else {
            waterToBurn -= (p.backpack_water || 0);
            p.backpack_water = 0;
            p.water_current = Math.max(0, (p.water_current || 0) - waterToBurn);
          }

          if (p.calories_current <= 0) {
            p.hp_current = Math.max(1, p.hp_current - (actualDays * 20));
          }
          if (p.water_current <= 0) {
            p.hp_current = Math.max(1, p.hp_current - (actualDays * 30));
          }
          p.ap_current = Math.min(p.ap_max, (p.ap_current || 0) + 40);
        }

        this.syncProvisionsInventory();
        this.saveState();
        this.render();
      }

      restInInn() {
        const p = this.gameState.player;
        if (this.getPlayerCopper() < 100) {
          soundEngine.playFail();
          alert("لا تملك تكلفة المبيت في النزل (1 فضية = 100 نحاس)!");
          return;
        }

        soundEngine.playSuccess();
        this.deductCopper(100);
        const oldDay = this.gameState.world_state.day;
        this.advanceGameDays(1, "مبيت بنزل آمن", true);

        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🛌 استأجرت غرفة آمنة في نزل [${p.current_landmark}]. تناولت عشاءً دافئاً وشربت ماءً عذباً ونمت نوماً عميقاً.\nاستيقظت مع فجر اليوم ${this.gameState.world_state.day} (بعد اليوم ${oldDay}), وقد تعافت صحتك وطاقتك بالكامل.`
        });
        this.recordSummary(`أقام اللاعب ليلة مبيت آمنة في نزل [${p.current_landmark}].`, 'rest');
        this.saveState();
        this.render();
      }

      campWilderness() {
        soundEngine.playClick();
        const p = this.gameState.player;
        const totalCal = (p.calories_current || 0) + (p.backpack_calories || 0);
        const totalWater = (p.water_current || 0) + (p.backpack_water || 0);

        if (totalCal < 2000 || totalWater < 2) {
          if (!confirm("⚠️ لا تملك ما يكفي من الزاد لقضاء ليلة برية آمنة (يلزم 2,000 سعرة ووحدتا ماء)! ستتعرض لعجز ونقص في الصحة. هل تريد التخييم رغم ذلك؟")) {
            return;

        const oldDay = this.gameState.world_state.day;
        this.advanceGameDays(1, "تخييم بري", false);
        this.gameState.story_log.push({
          turn: this.gameState.world_state.turn,
          day: this.gameState.world_state.day,
          text: `🏕️ نصبت خيمتك تحت نجوم البرية في [${p.current_landmark}]. استهلكت ليلتك 2,000 سعرة حرارية ووحدتي ماء.\nمرت الليلة لتستقبل فجر اليوم ${this.gameState.world_state.day} (بدلاً من اليوم ${oldDay}), واسترجعت عضلاتك بعض النشاط (+40 AP).`

        this.saveState();
        this.render();
